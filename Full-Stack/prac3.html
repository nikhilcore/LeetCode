<!DOCTYPE html>
<html>
<head>
<style>

body{
    font-family: Arial;
}

.card{
    width: 450px;
    border: 1px solid lightgray;
    border-radius: 10px;
    padding: 15px;
}

.header{
    margin-bottom: 15px;
}

.name{
    font-size: 22px;
    font-weight: bold;
}

.time{
    color: gray;
    float: right;
}

.role{
    color: gray;
    margin-top: 5px;
}

.content{
    font-size: 18px;
    line-height: 28px;
    margin-top: 15px;
}

.tag{
    color: rgb(29,155,240);
    margin-right: 10px;
    cursor: pointer;
}

.tag:hover{
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="card">

    <div class="header">
        <span class="name">John Doe</span>
        <span class="time">2h</span>

        <p class="role">Frontend Developer</p>
    </div>

    <p class="content">
        Learning HTML and CSS is fun! Practice every day to improve.
    </p>

    <span class="tag">#HTML</span>
    <span class="tag">#CSS</span>
    <span class="tag">#WebDevelopment</span>

</div>

</body>
</html>
