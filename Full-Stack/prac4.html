<!DOCTYPE html>
<html>
<head>
<style>

body{
    font-family: Arial;
}

.title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

/* Button 1 */

.subscribe{
    background-color:rgb(200,0,0);
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:4px;
    cursor:pointer;
    transition:opacity 0.2s;
    margin-right:10px;
}

.subscribe:hover{
    opacity:0.7;
}

.subscribe:active{
    opacity:0.4;
}

/* Button 2 */

.join{
    background-color:white;
    color:rgb(41,118,211);
    border:1px solid rgb(41,118,211);
    padding:11px 22px;
    border-radius:4px;
    cursor:pointer;
    transition:background-color 0.2s,
               color 0.2s;
    margin-right:10px;
}

.join:hover{
    background-color:rgb(41,118,211);
    color:white;
}

.join:active{
    opacity:0.6;
}

/* Button 3 */

.tweet{
    background-color:rgb(29,155,240);
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    transition:box-shadow 0.2s,
               transform 0.2s;
}

.tweet:hover{
    box-shadow:0 5px 10px rgba(0,0,0,0.25);
}

.tweet:active{
    transform:scale(0.95);
}

</style>
</head>

<body>

<p class="title">Button Practice</p>

<button class="subscribe">
    SUBSCRIBE
</button>

<button class="join">
    JOIN
</button>

<button class="tweet">
    Tweet
</button>

</body>
</html>
